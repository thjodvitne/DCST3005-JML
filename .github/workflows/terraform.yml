name: terraform

on:
  push:
    branches: [main]
    paths: ["stacks/**", "modules/**", "shared/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Miljø som skal rulles ut"
        type: choice
        options: [dev, test]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environment-scopet jobb gir OIDC-subject repo:<org>/<repo>:environment:<miljø>
    environment: ${{ inputs.environment || 'dev' }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_owner: ${{ vars.OWNER_SHORTNAME }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hvem er jeg? (K11)
        run: az account show

      - uses: hashicorp/setup-terraform@v3

      - name: Les state-oppsett fra shared/backend.hcl
        run: |
          get() { awk -F'"' -v k="$1" '$1 ~ k {print $2}' shared/backend.hcl; }
          echo "TF_VAR_state_storage_account=$(get storage_account_name)" >> "$GITHUB_ENV"
          echo "TF_VAR_state_container=$(get container_name)" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=${ENVIRONMENT}" >> "$GITHUB_ENV"

      - name: Plan og apply (network, deretter app)
        run: |
          for stack in network app; do
            echo "::group::${stack} (${ENVIRONMENT})"
            terraform -chdir="stacks/${stack}" init -input=false \
              -backend-config="${GITHUB_WORKSPACE}/shared/backend.hcl" \
              -backend-config="key=${stack}-${ENVIRONMENT}.tfstate"
            terraform -chdir="stacks/${stack}" plan -input=false -out=tfplan
            terraform -chdir="stacks/${stack}" apply -input=false tfplan
            echo "::endgroup::"
          done
